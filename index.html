<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오즈키즈 FC 통합 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Segoe UI',sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh;display:flex;font-size:16px}

/* ── 사이드바 ── */
.sidebar{width:240px;min-width:240px;background:#0f172a;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100;overflow-y:auto}
.brand{padding:24px 18px 18px;border-bottom:1px solid #1e293b}
.brand-name{font-size:17px;font-weight:700;color:#f1f5f9}
.brand-sub{font-size:13px;color:#64748b;margin-top:3px}
.sidenav{padding:10px 10px;flex:1}
.nav-group{margin-bottom:6px}
.nav-group-hd{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border-radius:8px;border:none;cursor:pointer;font-size:18px;font-weight:700;color:#94a3b8;background:transparent;font-family:inherit;text-align:left;transition:all .15s}
.nav-group-hd:hover{background:#1e293b;color:#e2e8f0}
.nav-group-hd.active{color:#e2e8f0}
.nav-icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.nav-chevron{margin-left:auto;font-size:12px;transition:transform .25s;display:inline-block;opacity:.6}
.nav-group-hd:not(.open) .nav-chevron{transform:rotate(-90deg)}
.nav-sub{overflow:hidden;max-height:200px;transition:max-height .3s ease}
.nav-sub.collapsed{max-height:0}
.nav-sub-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px 9px 38px;border-radius:7px;border:none;cursor:pointer;font-size:15px;font-weight:500;color:#64748b;background:transparent;font-family:inherit;text-align:left;transition:all .15s;margin-bottom:2px}
.nav-sub-item:hover:not(.active){background:#1e293b;color:#e2e8f0}
.nav-sub-item.active{background:#0ea5e920;color:#38bdf8;font-weight:700}
.nav-sub-dot{font-size:8px;opacity:.45;flex-shrink:0}
.sidebar-footer{padding:14px 18px;border-top:1px solid #1e293b}
.sidebar-footer p{font-size:13px;color:#475569;line-height:2}

/* ── 메인 ── */
.main-wrapper{margin-left:240px;flex:1;min-width:0;display:flex;flex-direction:column}
.section-wrap{display:none}.section-wrap.active{display:block}

/* ── 탑바 ── */
.topbar{padding:14px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:2px solid #e2e8f0;background:#ffffff;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.page-title{font-size:18px;font-weight:700;color:#0f172a;white-space:nowrap}
.updated{font-size:13px;color:#94a3b8}
.store-select{background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;padding:8px 14px;color:#334155;font-size:15px;cursor:pointer;font-family:inherit;min-width:180px}
.store-select:focus{outline:none;border-color:#0ea5e9}
.btn-group{display:flex;gap:2px;background:#f1f5f9;border-radius:8px;padding:4px}
.btn-group button{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;color:#64748b;background:transparent;font-family:inherit}
.btn-group button.active{background:#0ea5e9;color:#fff;box-shadow:0 1px 4px #0ea5e940}
.btn-group button:hover:not(.active){background:#e2e8f0;color:#334155}
.note-tag{font-size:13px;color:#64748b;padding:5px 12px;background:#f1f5f9;border-radius:6px;border:1.5px solid #e2e8f0;white-space:nowrap}

/* ── 요약 카드 ── */
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 28px}
.card{background:#fff;border-radius:12px;padding:20px 22px;border:1.5px solid #e2e8f0;border-top-width:4px;box-shadow:0 1px 4px #0000000a}
.card-c1{border-top-color:#0ea5e9}.card-c2{border-top-color:#22c55e}
.card-c3{border-top-color:#8b5cf6}.card-c4{border-top-color:#f97316}
.card-label{font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;font-weight:700}
.card-value{font-size:28px;font-weight:700;color:#0f172a;letter-spacing:-.5px;margin-bottom:4px}
.card-qty{font-size:15px;color:#0284c7;font-weight:600;margin-bottom:6px}
.card-sub{font-size:12px;color:#94a3b8;line-height:1.5;word-break:break-all}
.growth-up{color:#16a34a}.growth-down{color:#dc2626}.growth-flat{color:#94a3b8}

/* ── 컨텐츠 ── */
.content-area{padding:0 28px 32px;display:flex;flex-direction:column;gap:18px}
.table-wrap{overflow-x:auto;border-radius:12px;border:1.5px solid #e2e8f0;background:#fff;box-shadow:0 1px 4px #0000000a}
table{width:100%;border-collapse:collapse;font-size:15px}
thead tr{background:#f8fafc}
th{padding:12px 16px;text-align:right;font-weight:700;color:#475569;font-size:13px;white-space:nowrap;border-bottom:2px solid #e2e8f0}
th:first-child{text-align:left}
td{padding:10px 16px;text-align:right;border-bottom:1px solid #f1f5f9;color:#334155;white-space:nowrap;vertical-align:middle}
td:first-child{text-align:left;color:#475569;font-weight:600}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.td-growth{font-weight:700;font-size:14px}
.td-total td{background:#f1f5f9;font-weight:700;color:#0f172a;border-top:2px solid #e2e8f0}
.td-total td:first-child{color:#0284c7}
.chart-wrap{background:#fff;border-radius:12px;border:1.5px solid #e2e8f0;padding:20px 22px;box-shadow:0 1px 4px #0000000a}
.chart-wrap canvas{max-height:360px}
.chart-title{font-size:15px;font-weight:700;color:#475569;margin-bottom:14px}
.cv{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.cv-a{color:#334155;font-size:14px}.cv-q{font-size:13px;color:#94a3b8}
.partial-badge{display:inline-block;font-size:12px;padding:2px 7px;background:#7c3aed15;color:#7c3aed;border:1.5px solid #7c3aed30;border-radius:4px;margin-left:6px;vertical-align:middle}

/* ── 로딩 ── */
#loading{position:fixed;inset:0;background:#f0f4f8;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:18px}
#loading p{color:#64748b;font-size:16px;text-align:center;white-space:pre-line;max-width:380px;line-height:1.7}
.spinner{width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#0ea5e9;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 판매 베스트 ── */
.best-controls{padding:14px 28px;background:#fff;border-bottom:1px solid #e2e8f0}
.best-period-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.period-btn{padding:7px 16px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;color:#64748b;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.period-btn.active{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.period-btn:hover:not(.active){background:#f1f5f9;border-color:#94a3b8}
.date-input-wrap{display:flex;align-items:center;gap:6px;margin-left:4px}
.date-input{border:1.5px solid #cbd5e1;border-radius:8px;padding:7px 12px;font-size:14px;color:#334155;font-family:inherit;background:#fff}
.date-input:focus{outline:none;border-color:#0ea5e9}
.refresh-btn{padding:7px 13px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;font-size:16px;cursor:pointer;font-family:inherit;transition:all .2s}
.refresh-btn:hover{background:#f1f5f9}
.refresh-btn.spinning{animation:spin .8s linear infinite}

.best-tabs-row{display:flex;align-items:center;gap:6px;padding:12px 28px;background:#fff;border-bottom:1px solid #e2e8f0}
.best-tab-btn{padding:8px 22px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;color:#64748b;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.best-tab-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}
.best-tab-btn:hover:not(.active){background:#f1f5f9;border-color:#94a3b8}

.store-picker{display:none;flex-wrap:wrap;gap:8px;padding:14px 28px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.store-pill{padding:6px 14px;border-radius:20px;border:1.5px solid #cbd5e1;background:#fff;color:#475569;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.store-pill:hover{background:#f1f5f9}

.best-content{padding:18px 28px 32px}
.section-title-bar{display:flex;align-items:center;gap:10px;padding:13px 20px;background:#0f172a;color:#fff;border-radius:10px 10px 0 0;font-size:16px;font-weight:700}
.best-table-wrap{overflow-x:auto;border-radius:0 0 12px 12px;border:1.5px solid #e2e8f0;border-top:none;background:#fff;box-shadow:0 1px 4px #0000000a}
.best-status{display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px 28px;text-align:center}
.best-table{width:100%;border-collapse:collapse;font-size:15px}
.best-table thead tr{background:#f8fafc}
.best-table th{padding:12px 16px;font-weight:700;color:#475569;font-size:13px;white-space:nowrap;border-bottom:2px solid #e2e8f0;text-align:right}
.best-table th:nth-child(1),.best-table th:nth-child(2){text-align:center}
.best-table th:nth-child(3),.best-table th:nth-child(4){text-align:left}
.best-table td{padding:10px 16px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle;text-align:right}
.best-table td:nth-child(1),.best-table td:nth-child(2){text-align:center}
.best-table td:nth-child(3),.best-table td:nth-child(4){text-align:left}
.best-table tr:last-child td{border-bottom:none}
.best-table tr:hover td{background:#f8fafc}
.best-rank-1 td{background:#fffbeb!important}
.best-rank-2 td{background:#f0f9ff!important}
.best-rank-3 td{background:#f0fdf4!important}
.category-badge{display:inline-block;padding:3px 9px;background:#f1f5f9;border-radius:4px;font-size:12px;color:#475569;font-weight:600;white-space:nowrap}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .main-wrapper{margin-left:0}
  .summary-cards{grid-template-columns:1fr 1fr}
  .best-period-row{gap:5px}
  .period-btn{font-size:13px;padding:6px 11px}
}

/* ── 주간 리포트 ── */
.memo-wrap{padding:24px 28px 32px}
.memo-editor{background:#fff;border-radius:12px;border:1.5px solid #e2e8f0;padding:22px;margin-bottom:20px;box-shadow:0 1px 4px #0000000a;display:none}
.memo-editor.visible{display:block}
.memo-editor-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.memo-label{font-size:13px;font-weight:700;color:#475569;margin-bottom:6px}
.memo-field-input{border:1.5px solid #cbd5e1;border-radius:8px;padding:8px 12px;font-size:14px;color:#334155;font-family:inherit;width:100%}
.memo-field-input:focus{outline:none;border-color:#0ea5e9}
.memo-textarea{width:100%;border:1.5px solid #cbd5e1;border-radius:8px;padding:12px;font-size:14px;color:#334155;font-family:inherit;resize:vertical;min-height:320px;line-height:1.7}
.memo-textarea:focus{outline:none;border-color:#0ea5e9}
.memo-editor-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.memo-save-btn{padding:8px 20px;background:#0ea5e9;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.memo-save-btn:hover{background:#0284c7}
.memo-cancel-btn{padding:8px 16px;background:#f1f5f9;color:#475569;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.memo-new-btn{padding:8px 18px;background:#0ea5e9;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.memo-new-btn:hover{background:#0284c7}
.memo-list{display:flex;flex-direction:column;gap:14px}
.memo-card{background:#fff;border-radius:12px;border:1.5px solid #e2e8f0;padding:20px 22px;box-shadow:0 1px 4px #0000000a;cursor:pointer;transition:border-color .2s}
.memo-card:hover{border-color:#94a3b8}
.memo-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.memo-card-week{font-size:16px;font-weight:700;color:#0f172a}
.memo-card-date{font-size:13px;color:#94a3b8}
.memo-card-preview{font-size:14px;color:#64748b;line-height:1.8;overflow:hidden;max-height:9em}
.memo-card-actions{display:flex;gap:6px;margin-top:14px;border-top:1px solid #f1f5f9;padding-top:12px}
.memo-edit-btn{padding:5px 12px;background:#f1f5f9;color:#475569;border:1.5px solid #e2e8f0;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.memo-edit-btn:hover{background:#e2e8f0}
.memo-delete-btn{padding:5px 12px;background:#fff;color:#dc2626;border:1.5px solid #fca5a5;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.memo-delete-btn:hover{background:#fef2f2}
.memo-body{margin-top:14px;font-size:15px;line-height:1.9;color:#334155;border-top:1px solid #f1f5f9;padding-top:14px;display:none}
.memo-body.open{display:block}
.memo-body h1{font-size:22px;font-weight:800;margin:22px 0 10px;color:#0f172a;padding-bottom:8px;border-bottom:3px solid #0ea5e9}
.memo-body h2{font-size:18px;font-weight:700;margin:18px 0 8px;color:#0f172a;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
.memo-body h3{font-size:16px;font-weight:700;margin:14px 0 6px;color:#1e293b}
.memo-body h4{font-size:15px;font-weight:700;margin:10px 0 4px;color:#334155}
.memo-body ul{padding-left:22px;margin:4px 0 10px}
.memo-body li{margin-bottom:5px}
.memo-body p{margin-bottom:6px}
.memo-empty{text-align:center;padding:60px 28px;color:#94a3b8;font-size:15px;line-height:1.8}

/* ── 재고현황 ── */
</style>
</head>
<body>

<div id="loading">
  <div class="spinner" id="loading-spinner"></div>
  <p id="loading-msg">데이터 불러오는 중...</p>
</div>

<!-- ▸ 사이드바 -->
<aside class="sidebar">
  <div class="brand">
    <img src="logo.jpg" alt="오즈키즈 FC" style="width:100%;border-radius:8px;margin-bottom:10px;display:block;object-fit:cover;max-height:100px">
    <div class="brand-name">오즈키즈 FC</div>
    <div class="brand-sub">통합 대시보드</div>
  </div>
  <nav class="sidenav">
    <!-- 매출 현황 그룹 -->
    <div class="nav-group">
      <button class="nav-group-hd open active" id="grp-sales" onclick="toggleGroup('grp-sales','sub-sales')">
        <span class="nav-icon">📈</span>
        <span>매출 현황</span>
        <span class="nav-chevron">▾</span>
      </button>
      <div class="nav-sub" id="sub-sales">
        <button class="nav-sub-item active" id="nav-total" onclick="switchMain('total')">
          <span class="nav-sub-dot">●</span> 전체 매장
        </button>
        <button class="nav-sub-item" id="nav-store" onclick="switchMain('store')">
          <span class="nav-sub-dot">●</span> 매장별
        </button>
      </div>
    </div>
    <!-- 영업이익 그룹 -->
    <div class="nav-group">
      <button class="nav-group-hd open" id="grp-profit" onclick="toggleGroup('grp-profit','sub-profit')">
        <span class="nav-icon">💹</span>
        <span>영업이익</span>
        <span class="nav-chevron">▾</span>
      </button>
      <div class="nav-sub" id="sub-profit">
        <button class="nav-sub-item" id="nav-profit-total" onclick="switchMain('profit-total')">
          <span class="nav-sub-dot">●</span> 전체 매장
        </button>
        <button class="nav-sub-item" id="nav-profit-store" onclick="switchMain('profit-store')">
          <span class="nav-sub-dot">●</span> 매장별
        </button>
      </div>
    </div>
    <!-- 판매 베스트 그룹 -->
    <div class="nav-group">
      <button class="nav-group-hd open" id="grp-best" onclick="toggleGroup('grp-best','sub-best')">
        <span class="nav-icon">🏆</span>
        <span>판매 베스트</span>
        <span class="nav-chevron">▾</span>
      </button>
      <div class="nav-sub" id="sub-best">
        <button class="nav-sub-item" id="nav-best-overall" onclick="switchMain('best','overall')">
          <span class="nav-sub-dot">●</span> 전체 매장
        </button>
        <button class="nav-sub-item" id="nav-best-store" onclick="switchMain('best','store')">
          <span class="nav-sub-dot">●</span> 매장별
        </button>
      </div>
    </div>
    <!-- 주간 리포트 그룹 -->
    <div class="nav-group">
      <button class="nav-group-hd open" id="grp-memo" onclick="toggleGroup('grp-memo','sub-memo')">
        <span class="nav-icon">📝</span>
        <span>주간 리포트</span>
        <span class="nav-chevron">▾</span>
      </button>
      <div class="nav-sub" id="sub-memo">
        <button class="nav-sub-item" id="nav-memo" onclick="switchMain('memo')">
          <span class="nav-sub-dot">●</span> 리포트 목록
        </button>
      </div>
    </div>
    <!-- 재고현황 그룹 -->
    <div class="nav-group">
      <button class="nav-group-hd open" id="grp-inv" onclick="toggleGroup('grp-inv','sub-inv')">
        <span class="nav-icon">📦</span>
        <span>재고현황</span>
        <span class="nav-chevron">▾</span>
      </button>
      <div class="nav-sub" id="sub-inv">
        <button class="nav-sub-item" id="nav-inv-summary" onclick="switchMain('inv-summary')">
          <span class="nav-sub-dot">●</span> 매장별 재고
        </button>
      </div>
    </div>
  </nav>
  <div class="sidebar-footer">
    <p>온라인 매출 제외</p>
    <p>Google Sheets 연동</p>
  </div>
</aside>

<!-- ▸ 메인 -->
<div class="main-wrapper">

  <!-- ■ 전체 매장 -->
  <div id="sec-total" class="section-wrap active">
    <div class="topbar">
      <div class="topbar-left">
        <span class="page-title">전체 매장</span>
        <span id="updated-at" class="updated"></span>
      </div>
      <div class="topbar-right">
        <div class="btn-group" id="gran-total">
          <button class="active" onclick="setGran('total','cumulative')">누적</button>
          <button onclick="setGran('total','monthly')">월별</button>
          <button onclick="setGran('total','weekly')">주차별</button>
          <button onclick="setGran('total','daily')">일별</button>
        </div>
        <span class="note-tag" id="note-total">온라인 제외 · 집계중</span>
      </div>
    </div>
    <div class="summary-cards" id="cards-total"></div>
    <div class="content-area">
      <div class="chart-wrap">
        <div class="chart-title" id="chart-total-title"></div>
        <canvas id="canvas-total"></canvas>
      </div>
      <div id="table-total" class="table-wrap"></div>
    </div>
  </div>

  <!-- ■ 매장별 -->
  <div id="sec-store" class="section-wrap">
    <div class="topbar">
      <div class="topbar-left">
        <span class="page-title">매장별</span>
        <select class="store-select" id="store-select" onchange="onStoreChange()"></select>
      </div>
      <div class="topbar-right">
        <div class="btn-group" id="gran-store">
          <button class="active" onclick="setGran('store','cumulative')">누적</button>
          <button onclick="setGran('store','monthly')">월별</button>
          <button onclick="setGran('store','weekly')">주차별</button>
          <button onclick="setGran('store','daily')">일별</button>
        </div>
        <span class="note-tag" id="note-store">집계중</span>
      </div>
    </div>
    <div class="summary-cards" id="cards-store"></div>
    <div class="content-area">
      <div class="chart-wrap">
        <div class="chart-title" id="chart-store-title"></div>

<script>
// ════════════════════════════════════════════════
// ■ 매출 대시보드 — API & 데이터 처리
// ════════════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwfpCkdx5mp3sBkgjA1IMsNdJNl24D4tow7wwhVsAkdrjDz2uyUp7-bZhFv4OG3whFa/exec';

const MLABELS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
let DATA=null, STORE_LIST=[], MONTHS_26=[], MONTHS_25=[];
let T26=[], T25=[], Q26=[], Q25=[];
let WEEKS_26=[], WEEKS_25MAP={}, DAILY=null;

function callAPI() {
  return new Promise((resolve, reject) => {
    const cbName = '_apicb_' + Date.now();
    const el = document.createElement('script');
    const tid = setTimeout(() => {
      delete window[cbName]; el.remove();
      reject(new Error('응답 시간 초과 (10초)\n세션 만료 또는 캐시 없음'));
    }, 10000);
    window[cbName] = d => {
      clearTimeout(tid); delete window[cbName]; el.remove();
      d.error ? reject(new Error(d.error)) : resolve(d);
    };
    el.src = `${SCRIPT_URL}?callback=${cbName}`;
    el.onerror = () => { clearTimeout(tid); reject(new Error('네트워크 오류')); };
    document.head.appendChild(el);
  });
}

function processData(d) {
  DATA = d; STORE_LIST = d.stores || [];
  const m25 = d.monthly.filter(m => m.year === '2025');
  const m26 = d.monthly.filter(m => m.year === '2026');
  MONTHS_25 = Array.from({length:12}, (_,i) =>
    m25.find(m => m.month===i+1) || {month:i+1,total_amount:0,total_qty:0,stores:{}});
  const last26 = m26.reduce((mx,m) => Math.max(mx,m.month), 0);
  MONTHS_26 = Array.from({length:Math.max(last26,1)}, (_,i) =>
    m26.find(m => m.month===i+1) || {month:i+1,total_amount:0,total_qty:0,stores:{}});
  T26 = MONTHS_26.map(m => m.total_amount);
  T25 = MONTHS_25.map(m => m.total_amount);
  Q26 = MONTHS_26.map(m => m.total_qty);
  Q25 = MONTHS_25.map(m => m.total_qty);
  WEEKS_26 = d.weekly.filter(w => w.year==='2026');
  WEEKS_25MAP = {};
  d.weekly.filter(w => w.year==='2025').forEach(w => { WEEKS_25MAP[w.label]=w; });
  DAILY = d.daily;
}

// ── 포맷 ──
const Mcard = v => v ? `${(v/1e6).toFixed(1)}M` : '-';
const M     = v => v ? v.toLocaleString('ko-KR') + '원' : '-';
const QTY   = v => (v != null && v > 0) ? v.toLocaleString('ko-KR') + '개' : '-개';
const AVG   = v => v ? v.toLocaleString('ko-KR') + '원' : '-';
const ytdLbl = () => MONTHS_26.length > 0 ? `1~${MLABELS[MONTHS_26.length-1]}` : '';

function pct(cur, prev) {
  if (!prev) return '<span class="growth-flat">-</span>';
  const g = (cur-prev)/prev*100;
  if (g >  0.05) return `<span class="growth-up">▲${g.toFixed(1)}%</span>`;
  if (g < -0.05) return `<span class="growth-down">▼${Math.abs(g).toFixed(1)}%</span>`;
  return '<span class="growth-flat">±0.0%</span>';
}
function diffHtml(diff) {
  if (!diff) return '-';
  const r = Math.round(diff);
  const cls = r>=0 ? 'growth-up' : 'growth-down';
  return `<span class="${cls}">${r>0?'+':''}${M(r)}</span>`;
}
function cv(amt, qty) {
  if (!amt && !qty) return '<span style="color:#e2e8f0">-</span>';
  return `<div class="cv"><span class="cv-a">${M(amt)}</span><span class="cv-q">${QTY(qty)}</span></div>`;
}
function sd26(name){ return MONTHS_26.map(m=>({a:m.stores[name]?.amount||0,q:m.stores[name]?.qty||0})); }
function sd25(name){ return MONTHS_25.map(m=>({a:m.stores[name]?.amount||0,q:m.stores[name]?.qty||0})); }

// ── 카드 ──
function renderCards(id, a26, a25, q26, q25) {
  const n=a26.length;
  const ya26=a26.reduce((s,v)=>s+v,0);
  const ya25=a25.slice(0,n).reduce((s,v)=>s+v,0);
  const yq26=q26.reduce((s,v)=>s+v,0);
  const yq25=q25.slice(0,n).reduce((s,v)=>s+v,0);
  const lbl=ytdLbl();
  const ap26=yq26>0?Math.round(ya26/yq26):0;
  const ap25=yq25>0?Math.round(ya25/yq25):0;
  document.getElementById(id).innerHTML = `
    <div class="card card-c1">
      <div class="card-label">26년 누적 (${lbl})</div>
      <div class="card-value">${Mcard(ya26)}</div>
      <div class="card-qty">${QTY(yq26)}</div>
      <div class="card-sub">${M(ya26)}</div>
    </div>
    <div class="card card-c2">
      <div class="card-label">25년 동기간 (${lbl})</div>
      <div class="card-value">${Mcard(ya25)}</div>
      <div class="card-qty">${QTY(yq25)}</div>
      <div class="card-sub">${M(ya25)}</div>
    </div>
    <div class="card card-c3">
      <div class="card-label">전년 동기 대비</div>
      <div class="card-value" style="font-size:32px">${pct(ya26,ya25)}</div>
      <div class="card-sub">${ya26>=ya25?'↑':'↓'} ${M(Math.abs(ya26-ya25))}</div>
    </div>
    <div class="card card-c4">
      <div class="card-label">객단가 (26년 / 25년)</div>
      <div class="card-value" style="font-size:22px">${AVG(ap26)}</div>
      <div class="card-sub">25년 동기: ${AVG(ap25)}</div>
    </div>`;
}

// ── 테이블: 전체 누적 ──
function tblCumulative(id) {
  const n=T26.length, lbl=ytdLbl();
  let tot26=0,tot25=0,totQ26=0,totQ25=0, rows='';
  STORE_LIST.forEach(name => {
    const d26=sd26(name), d25=sd25(name);
    const v26=d26.reduce((s,d)=>s+d.a,0);
    const v25=d25.slice(0,n).reduce((s,d)=>s+d.a,0);
    const q26=d26.reduce((s,d)=>s+d.q,0);
    const q25=d25.slice(0,n).reduce((s,d)=>s+d.q,0);
    if (!v26&&!v25) return;
    tot26+=v26; tot25+=v25; totQ26+=q26; totQ25+=q25;
    const ap26=q26>0?Math.round(v26/q26):0;
    const ap25=q25>0?Math.round(v25/q25):0;
    rows+=`<tr><td>${name}</td>
      <td>${M(v26)}</td><td>${QTY(q26)}</td><td>${AVG(ap26)}</td>
      <td>${M(v25)}</td><td>${QTY(q25)}</td><td>${AVG(ap25)}</td>
      <td class="td-growth">${pct(v26,v25)}</td>
      <td class="td-growth">${diffHtml(v26-v25)}</td></tr>`;
  });
  const totAp26=totQ26>0?Math.round(tot26/totQ26):0;
  const totAp25=totQ25>0?Math.round(tot25/totQ25):0;
  document.getElementById(id).innerHTML=`
    <table><thead><tr>
      <th>매장명</th>
      <th>26년 매출 (${lbl})</th><th>판매수량</th><th>객단가</th>
      <th>25년 매출 (${lbl})</th><th>판매수량</th><th>객단가</th>
      <th>전년비</th><th>증감액</th>
    </tr></thead><tbody>${rows}
    <tr class="td-total"><td>전체 합계</td>
      <td>${M(tot26)}</td><td>${QTY(totQ26)}</td><td>${AVG(totAp26)}</td>
      <td>${M(tot25)}</td><td>${QTY(totQ25)}</td><td>${AVG(totAp25)}</td>
      <td class="td-growth">${pct(tot26,tot25)}</td>
      <td class="td-growth">${diffHtml(tot26-tot25)}</td>
    </tr></tbody></table>`;
}

// ── 테이블: 월별 ──
function tblMonthly(id, store) {
  const n=MONTHS_26.length, lbl=ytdLbl();
  let sum26a=0,sum25a=0,sum26q=0,sum25q=0;
  const rowsArr=[];
  MONTHS_26.forEach((m26,i) => {
    const amt26=store?(m26.stores[store]?.amount||0):m26.total_amount;
    const qty26=store?(m26.stores[store]?.qty||0):m26.total_qty;
    const m25=MONTHS_25[i]||{};
    const amt25=store?(m25.stores?.[store]?.amount||0):(m25.total_amount||0);
    const qty25=store?(m25.stores?.[store]?.qty||0):(m25.total_qty||0);
    sum26a+=amt26; sum25a+=amt25; sum26q+=qty26; sum25q+=qty25;
    const isLast=i===n-1;
    const ap26=qty26>0?Math.round(amt26/qty26):0;
    const ap25=qty25>0?Math.round(amt25/qty25):0;
    rowsArr.push(`<tr><td>${MLABELS[m26.month-1]}${isLast?'<span class="partial-badge">집계중</span>':''}</td>
      <td>${M(amt26)}</td><td>${QTY(qty26)}</td><td>${AVG(ap26)}</td>
      <td>${M(amt25)}</td><td>${QTY(qty25)}</td><td>${AVG(ap25)}</td>
      <td class="td-growth">${pct(amt26,amt25)}</td>
      <td class="td-growth">${diffHtml(amt26-amt25)}</td></tr>`);
  });
  const sumAp26=sum26q>0?Math.round(sum26a/sum26q):0;
  const sumAp25=sum25q>0?Math.round(sum25a/sum25q):0;
  const totalRow=`<tr class="td-total"><td>누적 (${lbl})</td>
    <td>${M(sum26a)}</td><td>${QTY(sum26q)}</td><td>${AVG(sumAp26)}</td>
    <td>${M(sum25a)}</td><td>${QTY(sum25q)}</td><td>${AVG(sumAp25)}</td>
    <td class="td-growth">${pct(sum26a,sum25a)}</td>
    <td class="td-growth">${diffHtml(sum26a-sum25a)}</td></tr>`;
  document.getElementById(id).innerHTML=`
    <table><thead><tr>
      <th>월</th><th>26년 매출</th><th>수량</th><th>객단가</th>
      <th>25년 매출</th><th>수량</th><th>객단가</th><th>전년비</th><th>증감액</th>
    </tr></thead><tbody>${rowsArr.reverse().join('')}${totalRow}</tbody></table>`;
}

// ── 테이블: 주차별 ──
function tblWeekly(id, store) {
  if (!WEEKS_26.length) {
    document.getElementById(id).innerHTML='<div style="padding:24px;color:#94a3b8;text-align:center;font-size:15px">주차별 데이터 없음</div>';
    return;
  }
  let sum26a=0,sum25a=0,sum26q=0,sum25q=0;
  const rowsArr=[];
  WEEKS_26.forEach(w26 => {
    const w25=WEEKS_25MAP[w26.label];
    const amt26=store?(w26.stores[store]?.amount||0):w26.total_amount;
    const qty26=store?(w26.stores[store]?.qty||0):w26.total_qty;
    const amt25=store?(w25?.stores[store]?.amount||0):(w25?.total_amount||0);
    const qty25=store?(w25?.stores[store]?.qty||0):(w25?.total_qty||0);
    sum26a+=amt26; sum25a+=amt25; sum26q+=qty26; sum25q+=qty25;
    const ap26=qty26>0?Math.round(amt26/qty26):0;
    const ap25=qty25>0?Math.round(amt25/qty25):0;
    rowsArr.push(`<tr><td>${w26.label}</td>
      <td>${M(amt26)}</td><td>${QTY(qty26)}</td><td>${AVG(ap26)}</td>
      <td>${M(amt25)}</td><td>${QTY(qty25)}</td><td>${AVG(ap25)}</td>
      <td class="td-growth">${pct(amt26,amt25)}</td>
      <td class="td-growth">${(amt26&&amt25)?diffHtml(amt26-amt25):'-'}</td></tr>`);
  });
  const sumAp26=sum26q>0?Math.round(sum26a/sum26q):0;
  const sumAp25=sum25q>0?Math.round(sum25a/sum25q):0;
  const totalRow=`<tr class="td-total"><td>누적 합계</td>
    <td>${M(sum26a)}</td><td>${QTY(sum26q)}</td><td>${AVG(sumAp26)}</td>
    <td>${M(sum25a)}</td><td>${QTY(sum25q)}</td><td>${AVG(sumAp25)}</td>
    <td class="td-growth">${pct(sum26a,sum25a)}</td>
    <td class="td-growth">${diffHtml(sum26a-sum25a)}</td></tr>`;
  document.getElementById(id).innerHTML=`
    <table><thead><tr>
      <th>주차</th><th>26년 매출</th><th>수량</th><th>객단가</th>
      <th>25년 매출</th><th>수량</th><th>객단가</th><th>전년비</th><th>증감액</th>
    </tr></thead><tbody>${rowsArr.reverse().join('')}${totalRow}</tbody></table>`;
}

// ── 테이블: 일별 ──
function tblDaily(id, store) {
  if (!DAILY||!DAILY.labels.length) {
    document.getElementById(id).innerHTML='<div style="padding:24px;color:#94a3b8;text-align:center;font-size:15px">일별 데이터 없음</div>';
    return;
  }
  const len=DAILY.labels.length, START=Math.max(0,len-30);
  let rows='';
  for (let i=len-1; i>=START; i--) {
    const amt=store?(DAILY.stores[store]?.amount[i]||0):DAILY.total_amount[i];
    const qty=store?(DAILY.stores[store]?.qty[i]||0):DAILY.total_qty[i];
    const avgP=qty>0?Math.round(amt/qty):0;
    const pAmt=store?(DAILY.stores[store]?.amount[i-1]||0):(DAILY.total_amount[i-1]||0);
    const dow=['일','월','화','수','목','금','토'];
    const d=new Date('2026-'+DAILY.labels[i]);
    const dayLabel=isNaN(d.getTime())?DAILY.labels[i]:`${DAILY.labels[i]} (${dow[d.getDay()]})`;
    rows+=`<tr><td>${dayLabel}</td>
      <td>${M(amt)}</td><td>${QTY(qty)}</td><td>${AVG(avgP)}</td>
      <td class="td-growth">${i>0?pct(amt,pAmt):'<span class="growth-flat">-</span>'}</td></tr>`;
  }
  document.getElementById(id).innerHTML=`
    <table><thead><tr>
      <th>날짜</th><th>매출</th><th>수량</th><th>객단가</th><th>전일 대비</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

const BEST_API_URL = 'https://script.google.com/macros/s/AKfycbwLoh3VgIt2oXbgcGzBb-07dsgxSlkh7uLp3KDDXvpkH2BmPZcqXxe8BAmRPZIyfAI/exec';
const BEST_STORES = ['남악','부천','의정부','인천','유성','여수','율하','충장',
  '동수원','송파','제주','괴정','강서','순천','평택','고척',
  '원주','마리오','창원','평촌','STCO현풍','STCO용인','면세점'];
const BEST_STORE_COLORS = {
  '남악':'#1565c0','부천':'#0277bd','의정부':'#0288d1','인천':'#0097a7',
  '유성':'#00838f','여수':'#2e7d32','율하':'#388e3c','충장':'#558b2f',
  '동수원':'#9e9d24','송파':'#f57f17','제주':'#e65100','괴정':'#bf360c',

  '원주':'#1565c0','마리오':'#00695c','창원':'#2e7d32','STCO현풍':'#558b2f',

};

const bestState = {
  startDate: '', endDate: '',
  tab: 'overall', store: BEST_STORES[0],
  cacheOverall: {}, cacheStores: {}
};

function toYMD(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getThisTuesday(d) {
  const day=d.getDay(), diff=day===0?-5:day===1?-6:2-day;
  const tue=new Date(d); tue.setDate(d.getDate()+diff); return tue;
}

function bestSetPeriod(type) {
  const today=new Date();
  const yest=new Date(today); yest.setDate(today.getDate()-1);
  let start=yest, end=yest;
  if (type==='yesterday') {
    start=end=yest;
  } else if (type==='week') {
    start=getThisTuesday(today); end=yest;
  } else if (type==='lastweek') {
    const tue=getThisTuesday(today);
    end=new Date(tue); end.setDate(tue.getDate()-1);
    start=new Date(end); start.setDate(end.getDate()-6);
  } else if (type==='month') {
    start=new Date(today.getFullYear(),today.getMonth(),1); end=yest;
  } else if (type==='lastmonth') {
    const first=new Date(today.getFullYear(),today.getMonth(),1);
    end=new Date(first); end.setDate(first.getDate()-1);
    start=new Date(end.getFullYear(),end.getMonth(),1);
  } else if (type==='cumul') {
    start=new Date(today.getFullYear(),0,1); // 올해 1월 1일
    end=yest;
  }
  bestState.startDate=toYMD(start);
  bestState.endDate=toYMD(end);
  document.getElementById('date-start').value=bestState.startDate;
  document.getElementById('date-end').value=bestState.endDate;
  ['yesterday','week','lastweek','month','lastmonth','cumul'].forEach(t =>
    document.getElementById('btn-'+t).classList.toggle('active', t===type));
  bestState.cacheOverall={}; bestState.cacheStores={};
  bestLoadData();
}

function bestOnDateChange() {
  bestState.startDate=document.getElementById('date-start').value;
  bestState.endDate=document.getElementById('date-end').value;
  ['yesterday','week','lastweek','month','lastmonth','cumul'].forEach(t =>
    document.getElementById('btn-'+t).classList.remove('active'));
  bestState.cacheOverall={}; bestState.cacheStores={};
  if (bestState.startDate && bestState.endDate) bestLoadData();
}

function bestSwitchStore(name) {
  bestState.store=name;
  document.querySelectorAll('.store-pill').forEach(el => {
    const on=el.dataset.store===name;
    el.classList.toggle('active',on);
    const col=BEST_STORE_COLORS[name]||'#1565c0';
    el.style.background=on?col:'';
    el.style.color=on?'#fff':'';
    el.style.borderColor=on?col:'';
  });
  const key=bestState.startDate+'_'+bestState.endDate;
  if (bestState.cacheStores[key]) bestRenderContent(bestState.cacheStores[key]);
}

async function bestLoadData() {
  if (!bestState.startDate||!bestState.endDate) return;
  const key=bestState.startDate+'_'+bestState.endDate;
  const isAll=bestState.tab==='overall';
  const cache=isAll?bestState.cacheOverall:bestState.cacheStores;
  if (cache[key]) { bestRenderContent(cache[key]); return; }

  bestShowLoading();
  const rb=document.getElementById('best-refresh');
  rb && rb.classList.add('spinning');

  try {
    let url=BEST_API_URL+'?startDate='+bestState.startDate+'&endDate='+bestState.endDate;
    if (!isAll) url+='&view=stores';
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(), 90000);
    let res;
    try { res=await fetch(url,{signal:ctrl.signal}); } finally { clearTimeout(tid); }
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if (data.error==='session_expired') { bestShowError('이지어드민 세션 만료\n쿠키를 갱신해 주세요.'); return; }
    if (data.error) throw new Error(data.error);
    cache[key]=data;
    if (data.updatedAt) document.getElementById('best-updated-at').textContent='⏱ '+data.updatedAt;
    bestRenderContent(data);
  } catch(err) {
    bestShowError(err.name==='AbortError'
      ? '요청 시간 초과 (90초)\nApps Script에서 precomputeAndCache를 실행하세요.'
      : err.message);
  } finally {
    rb && rb.classList.remove('spinning');
  }
}

function bestRenderContent(data) {
  document.getElementById('best-status').style.display='none';
  document.getElementById('best-table').style.display='';
  const isStore=bestState.tab==='store';
  const lbl=bestState.startDate===bestState.endDate
    ? bestState.startDate
    : bestState.startDate+' ~ '+bestState.endDate;
  if (isStore) {
    const sd=(data.stores||[]).find(s=>s.name===bestState.store);
    bestRenderTable(sd?sd.products:[], true, lbl);
  } else {
    bestRenderTable(data.overall||[], false, lbl);
  }
}

function bestRenderTable(items, isStore, label) {
  const tbody=document.getElementById('table-tbody');
  const titleBar=document.getElementById('section-title-bar');
  const topN=isStore?10:20;
  const col=BEST_STORE_COLORS[bestState.store]||'#1565c0';
  titleBar.style.background=isStore?col:'#0f172a';
  document.getElementById('section-icon').textContent=isStore?'🏪':'🥇';
  document.getElementById('section-title').textContent=
    isStore ? bestState.store+'  TOP '+topN+'  ·  '+label
            : '전체 판매 베스트  TOP '+topN+'  ·  '+label;
  if (!items||!items.length) {
    tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:48px;color:#94a3b8;font-size:15px">해당 기간에 데이터가 없습니다.</td></tr>';
    return;
  }
  const medals=['🥇','🥈','🥉'];
  const fmtP=v=>v?Number(v).toLocaleString('ko-KR')+'원':'-';
  const fmtQ=v=>v?Number(v).toLocaleString('ko-KR')+'개':'-';
  tbody.innerHTML=items.slice(0,topN).map((item,idx)=>{
    const r=idx+1;

function memoRenderList() {
  const el = document.getElementById('memo-list');

      </div>
      <div class="memo-card-preview">${m.content.split('\n').filter(l=>(l.startsWith('# ')&&!l.startsWith('## '))||(l.startsWith('## ')&&!l.startsWith('### '))).map(l=>l.startsWith('## ')?`<div style="font-weight:700;color:#334155">${escHtml(l.slice(3))}</div>`:`<div style="font-weight:800;color:#0f172a">${escHtml(l.slice(2))}</div>`).join('')||`<div>${escHtml(m.content.split('\n').filter(l=>l.trim())[0]||'')}</div>`}</div>
      <div class="memo-body" id="memo-body-${m.id}">${memoMd(m.content)}</div>
      <div class="memo-card-actions">
        <button class="memo-edit-btn" onclick="memoEdit('${m.id}',event)">✏️ 수정</button>
        <button class="memo-delete-btn" onclick="memoDelete('${m.id}',event)">🗑️ 삭제</button>
      </div>
    </div>`).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function memoMd(md) {
  const inl = s => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  let html = '', inUl = false;
  for (const raw of md.split('\n')) {
    const l = escHtml(raw);
    if      (l.startsWith('#### ')) { if(inUl){html+='</ul>';inUl=false;} html+=`<h4>${inl(l.slice(5))}</h4>`; }
    else if (l.startsWith('### '))  { if(inUl){html+='</ul>';inUl=false;} html+=`<h3>${inl(l.slice(4))}</h3>`; }
    else if (l.startsWith('## '))   { if(inUl){html+='</ul>';inUl=false;} html+=`<h2>${inl(l.slice(3))}</h2>`; }
    else if (l.startsWith('# '))    { if(inUl){html+='</ul>';inUl=false;} html+=`<h1>${inl(l.slice(2))}</h1>`; }
    else if (l.startsWith('- '))    { if(!inUl){html+='<ul>';inUl=true;}  html+=`<li>${inl(l.slice(2))}</li>`; }
    else if (l.trim()==='')         { if(inUl){html+='</ul>';inUl=false;} html+='<br>'; }
    else                             { if(inUl){html+='</ul>';inUl=false;} html+=`<p>${inl(l)}</p>`; }
  }
  if (inUl) html += '</ul>';
  return html;
}

function memoToggle(id, e) {
  if (e.target.closest('.memo-card-actions')) return;
  document.getElementById('memo-body-'+id).classList.toggle('open');
}

function memoShowEditor(id, weekLabel, reportDate, content) {
  const ed = document.getElementById('memo-editor');
  document.getElementById('memo-week').value = weekLabel || '';
  document.getElementById('memo-date').value = reportDate || new Date().toISOString().slice(0,10);
  document.getElementById('memo-content').value = content || '';
  document.getElementById('memo-editing-id').value = id || '';
  ed.classList.add('visible');
  ed.scrollIntoView({behavior:'smooth', block:'start'});
}

function memoHideEditor() {
  document.getElementById('memo-editor').classList.remove('visible');
  document.getElementById('memo-editing-id').value = '';
}

function memoSave() {
  const weekLabel  = document.getElementById('memo-week').value.trim();
  const reportDate = document.getElementById('memo-date').value;
  const content    = document.getElementById('memo-content').value.trim();
  const id         = document.getElementById('memo-editing-id').value;
  if (!weekLabel || !content) { alert('주차와 내용을 입력해주세요.'); return; }
  const enc = btoa(unescape(encodeURIComponent(content)));
  const url = SCRIPT_URL + '?' + new URLSearchParams({action:'saveMemo', id, weekLabel, reportDate, content: enc, encoded:'1'});
  fetch(url)
    .then(r => r.json())
    .then(d => { if(d.ok){ memoHideEditor(); memoLoaded=false; memoLoadAll(); } else alert('저장 실패'); })
    .catch(() => alert('저장 실패. 다시 시도해주세요.'));
}

function memoEdit(id, e) {
  e.stopPropagation();
  const m = memoData.find(x => x.id === id);
  if (m) memoShowEditor(m.id, m.weekLabel, m.reportDate, m.content);
}

function memoDelete(id, e) {
  e.stopPropagation();
  if (!confirm('이 리포트를 삭제할까요?')) return;
  const url = SCRIPT_URL + '?' + new URLSearchParams({action:'deleteMemo', id});
  fetch(url)
    .then(r => r.json())
    .then(d => { if(d.ok){ memoLoaded=false; memoLoadAll(); } else alert('삭제 실패'); })
    .catch(() => alert('삭제 실패.'));
}

function callProfitAPI(){
  return new Promise((resolve,reject)=>{

    const tid=setTimeout(()=>{delete window[cbName];el.remove();reject(new Error('영업이익 응답 시간 초과'));},30000);

const INV_API_URL = 'https://script.google.com/a/macros/openhan.kr/s/AKfycbxoMaX5-jFHJxu0MteABHstUwRsG_tBL2ZimcrHDDQsgjW3Sg0aC4E--3ZJSYlzxMb-/exec';
const INV_STORE_ORDER = [
  '남악','부천','의정부','인천','유성','여수','율하','충장',
  '동수원','송파','제주','괴정','강서','순천','평택','고척',
  '원주','마리오','창원','평촌','면세점','STCO현풍','STCO용인','(롯)평촌'
];

let INV_DATA = null, invLoaded = false;

function callInvAPI(inv_type, q) {
  return new Promise((resolve, reject) => {
    const cbName = '_invcb_' + Date.now();
    const el = document.createElement('script');
    const tid = setTimeout(() => {
      delete window[cbName]; el.remove();
      reject(new Error('재고 API 응답 시간 초과 (30초)'));
    }, 30000);
    window[cbName] = d => {
      clearTimeout(tid); delete window[cbName]; el.remove();
      d.error ? reject(new Error(d.error)) : resolve(d);
    };
    let src = INV_API_URL + '?action=inventory&inv_type=' + inv_type + '&callback=' + cbName;
    if (q) src += '&q=' + encodeURIComponent(q);
    el.src = src;
    el.onerror = () => { clearTimeout(tid); reject(new Error('재고 API 연결 오류')); };
    document.head.appendChild(el);
  });
}

async function invLoadSummary() {
  const cards = document.getElementById('cards-inv');
  const tbl = document.getElementById('table-inv');
  cards.innerHTML = '<div style="padding:24px;color:#64748b;grid-column:1/-1">데이터 불러오는 중...</div>';
  tbl.innerHTML = '';
  try {
    INV_DATA = await callInvAPI('summary');
    invLoaded = true;
    renderInvSummary();
  } catch(e) {
    cards.innerHTML = `<div style="padding:24px;color:#dc2626;grid-column:1/-1">⚠️ 로드 실패: ${e.message}</div>`;
  }
}

function invRefresh() {
  INV_DATA = null; invLoaded = false;
  invLoadSummary();
}

function renderInvSummary() {
  if (!INV_DATA) return;
  const d = INV_DATA;
  const lat = d.latest;

  // 카드
  if (lat) {
    document.getElementById('inv-updated-at').textContent = '⏱ ' + lat.date + ' 스냅샷';
    const fmtW = v => v ? Math.floor(v/10000).toLocaleString()+'만원' : '-';
    document.getElementById('cards-inv').innerHTML = `
      <div class="card card-c1">
        <div class="card-label">전체 재고 수량</div>
        <div class="card-value" style="font-size:28px">${(lat.total_qty||0).toLocaleString()}개</div>
        <div class="card-sub">본사: ${(lat.bonsa_qty||0).toLocaleString()}개 · 매장: ${(lat.store_qty||0).toLocaleString()}개</div>
      </div>
      <div class="card card-c2">
        <div class="card-label">전체 재고 원가</div>
        <div class="card-value" style="font-size:26px">${fmtW(lat.total_cost)}</div>
        <div class="card-sub">본사: ${fmtW(lat.bonsa_cost)} · 매장: ${fmtW(lat.store_cost)}</div>
      </div>
      <div class="card card-c3">
        <div class="card-label">데이터 적재 일수</div>
        <div class="card-value" style="font-size:28px">${(d.history||[]).length}일</div>
        <div class="card-sub">매일 오전 6시 자동 저장</div>
      </div>`;
  } else {
    document.getElementById('cards-inv').innerHTML =
      '<div style="padding:24px;color:#94a3b8;grid-column:1/-1">저장된 스냅샷이 없습니다. Apps Script에서 saveInventorySnapshot()을 먼저 실행하세요.</div>';
  }

  // 트렌드 차트
  const hist = d.history || [];
  if (hist.length > 1) {
    chartInvTrend('canvas-inv', hist.map(h=>h.date), hist.map(h=>h.total_qty), hist.map(h=>h.store_qty));
  } else {
    document.getElementById('chart-inv-title').textContent = '재고 추이 (데이터 2일 이상부터 표시)';
  }

  // 매장별 테이블
  if (lat && lat.stores) {
    tblInvStores('table-inv', lat.stores);
  }
}

function chartInvTrend(cid, labels, totalData, storeData) {
  killChart(cid);
  charts[cid] = new Chart(document.getElementById(cid).getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [
      { label: '전체 재고', data: totalData, borderColor: '#0ea5e9',
        backgroundColor: '#0ea5e918', borderWidth: 2.5, pointRadius: 4, fill: true, tension: .3 },
      { label: '매장 재고', data: storeData, borderColor: '#8b5cf6',
        backgroundColor: '#8b5cf618', borderWidth: 2.5, pointRadius: 4, fill: true, tension: .3 }
    ]},
    options: {
      responsive: true, interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: CHART_COLORS.legend, font: { size: 13 } } },
        tooltip: {
          backgroundColor: CHART_COLORS.tooltip.bg, titleColor: CHART_COLORS.tooltip.title,
          bodyColor: CHART_COLORS.tooltip.body,
          callbacks: { label(c) { return ` ${c.dataset.label}: ${c.parsed.y.toLocaleString()}개`; } }
        }
      },
      scales: {
        x: { ticks: { color: CHART_COLORS.tick, maxRotation: 45, maxTicksLimit: 30, font: { size: 12 } }, grid: { color: CHART_COLORS.gridX } },
        y: { ticks: { color: CHART_COLORS.tick, font: { size: 13 }, callback: v => v.toLocaleString() }, grid: { color: CHART_COLORS.gridY } }
      }
    }
  });
}

function tblInvStores(id, stores) {
  const fmtW = v => Math.floor(v/10000).toLocaleString()+'만원';
  const rows = INV_STORE_ORDER.map(name => {
    const s = stores[name] || {qty:0, cost:0};
    const dim = s.qty === 0 ? 'color:#cbd5e1' : 'font-weight:700';
    return `<tr>
      <td>${name}</td>
      <td style="text-align:right;${dim}">${s.qty ? s.qty.toLocaleString()+'개' : '-'}</td>
      <td style="text-align:right;${dim}">${s.cost ? fmtW(s.cost) : '-'}</td>
    </tr>`;
  }).join('');
  const totalQty  = INV_STORE_ORDER.reduce((s,n) => s + ((stores[n]||{}).qty||0), 0);
  const totalCost = INV_STORE_ORDER.reduce((s,n) => s + ((stores[n]||{}).cost||0), 0);
  document.getElementById(id).innerHTML = `
    <table><thead><tr>
      <th>매장명</th>
      <th style="text-align:right">재고 수량</th>
      <th style="text-align:right">재고 원가</th>
    </tr></thead>
    <tbody>${rows}
    <tr class="td-total">
      <td>매장 합계</td>
      <td style="text-align:right">${totalQty.toLocaleString()}개</td>
      <td style="text-align:right">${fmtW(totalCost)}</td>
    </tr>
    </tbody></table>`;
}

(async function init() {
  try {
    initBestStores();
    const [salesRes,profitRes]=await Promise.allSettled([callAPI(),callProfitAPI()]);
    if(salesRes.status==='rejected') throw salesRes.reason;
    const data=salesRes.value;
    processData(data);
    document.getElementById('updated-at').textContent=data.updatedAt?'⏱ '+data.updatedAt:'';
    const lastM=MONTHS_26.length>0?MLABELS[MONTHS_26.length-1]:'';
    document.getElementById('note-total').textContent=`온라인 제외 · ${lastM}까지 집계`;
    document.getElementById('note-store').textContent=`${lastM}까지 집계`;
    const sel=document.getElementById('store-select');
    STORE_LIST.forEach(name=>{
      const o=document.createElement('option');
      o.value=name; o.textContent=name; sel.appendChild(o);
    });
    state.store.name=STORE_LIST[0]||'';
    if(profitRes.status==='fulfilled'){
      processProfitData(profitRes.value);
      if(PROFIT_DATA?.updatedAt) document.getElementById('profit-updated-at').textContent='⏱ '+PROFIT_DATA.updatedAt;
      const psel=document.getElementById('profit-store-select');
      PSTORES.forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;psel.appendChild(o);});
      profitState.store.name=PSTORES[0]||'';
    } else {
      console.warn('영업이익 데이터 로드 실패:',profitRes.reason);
    }
    document.getElementById('loading').style.display='none';
    renderTotal();
  } catch(e) {
    document.getElementById('loading-spinner').style.display='none';
    document.getElementById('loading-msg').innerHTML=
      `<span style="font-size:36px">⚠️</span>\n<strong style="color:#dc2626">데이터 로드 실패</strong>\n${e.message}`;
    console.error(e);
  }
})();
